# Builds the publishable tree for an Azure Static Web App (build and quality, section 7; DEC-140 to
# DEC-143): a root, one folder per platform, and below each platform one folder per uFTi app release,
# each holding the manual and the Quick Start as a website and a PDF. It builds with the toolkit and
# the plugin only, checks every link in the tree, and keeps the tree and the archives of each current
# release as artifacts. On a push to main or release/**, or on demand (workflow_dispatch with "publish"
# ticked), the "publish" job then pushes the finished tree to the publish branch, so the output of this
# repository is a pushed asset that an Azure Static Web App can deploy from (DEC-144). The releases
# already published are read back from that branch before the build, so an old release stays online
# (DEC-143). It creates no Azure resource and holds no secret.
#
# The "deploy" job then deploys the tree to Azure Static Web Apps (issue 77), from a push to main or release/**, or on demand.
# Third-party actions are pinned to full commit SHAs. Permissions are read-only, except in the publish job.
name: Site

on:
  push:
    branches: [dev, main, 'release/**']
  pull_request:
    paths: ['build/**', 'content/**', '.github/workflows/site.yml']
  workflow_dispatch:
    inputs:
      publish:
        description: "Push the tree to the publish branch after the build"
        type: boolean
        default: false
      branch:
        description: "The branch that holds the published tree"
        type: string
        default: publish
      deploy:
        description: "Deploy the tree to Azure Static Web Apps after it is published (needs publish ticked)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: site-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PUBLISH_BRANCH: ${{ inputs.branch || 'publish' }}

jobs:
  site:
    name: build the tree
    runs-on: ubuntu-24.04
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Pinned tools (cached by the lock file)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tools
          key: tools-build-${{ runner.os }}-${{ hashFiles('build/tools.lock') }}
      - name: Bootstrap the toolkit, the plugin, DesignSystemPDF and Pagefind
        run: build/scripts/bootstrap.sh --build-only
      - name: Earlier releases, read back from the publish branch
        run: build/scripts/kept-from-branch.sh "$PUBLISH_BRANCH" kept
      - name: Build the tree and check its links
        run: build/scripts/build-site.sh --keep kept --archive
      - name: Check the tree again, with the PowerShell checker (the bash build is not checked by it otherwise)
        run: pwsh -NoProfile -File build/scripts/check-site.ps1
      - name: Keep the tree
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: out/site
          if-no-files-found: error
      - name: Keep the archives of the current releases
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-archives
          path: out/archive
          if-no-files-found: error
      - name: Keep the logs and the link report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-logs
          path: |
            out/logs
            out/reports/site
          if-no-files-found: ignore

  # Pushes the finished tree to the publish branch (DEC-144). Only from main, release/** or an on-demand
  # run with "publish" ticked. One run at a time, never cancelled half way, so two publications cannot
  # overwrite each other. The tree already holds the earlier releases (read back before the build), and
  # the branch is replaced by exactly that tree.
  publish:
    name: publish the tree to a branch
    needs: site
    if: (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/'))) || (github.event_name == 'workflow_dispatch' && inputs.publish)
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: publish
      cancel-in-progress: false
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: The built tree
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: out/site
      - name: Push the tree to the publish branch
        run: build/scripts/publish-tree.sh out/site "$PUBLISH_BRANCH" "$GITHUB_REF_NAME"

  # Deploys the tree to Azure Static Web Apps (issue 77; DEC-142). It runs after a successful publish, on a push
  # to main or release/**, or on demand with "deploy" ticked together with "publish" (and the default branch
  # name). It needs the repository secret AZURE_STATIC_WEB_APPS_API_TOKEN (the deployment token of the Static
  # Web App; rotate it with "Reset deployment token" in the Azure portal and set the secret again). The job
  # runs in the GitHub environment azure-production, where the maintainer can require a reviewer. The tree is
  # already built, so no build runs in Azure; the action is pinned to a full commit SHA (the v1 release).
  deploy:
    name: deploy to Azure Static Web Apps
    needs: publish
    if: needs.publish.result == 'success' && (inputs.branch || 'publish') == 'publish' && (github.event_name == 'push' || inputs.deploy)
    runs-on: ubuntu-24.04
    environment: azure-production
    permissions:
      contents: read
    concurrency:
      group: deploy
      cancel-in-progress: false
    steps:
      - name: The built tree
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: site
      - name: Deploy
        uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9 # v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: site
          skip_app_build: true

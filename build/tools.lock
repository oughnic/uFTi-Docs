# build/tools.lock
#
# Every tool the build and the quality gates use, pinned by exact version and SHA-256
# (build and quality, section 1). build/scripts/bootstrap.ps1 and bootstrap.sh read this file,
# download each file into .tools/, and refuse anything whose checksum differs. CI caches .tools/
# by the hash of this file, so a change here is a fresh install everywhere.
#
# Format: [tool] sections of "key = value" lines. A key with a platform suffix (.windows-x64,
# .linux-x64, .macos-x64, .macos-arm64) applies to that platform; a key without one applies
# everywhere. A platform without its own key falls back: windows-arm64 to windows-x64 (Windows runs x64
# programs under emulation) and macos-arm64 to macos-x64. "upstream-check" says what the checksum was
# compared with when it was pinned.
#
# Upstream releases checked: 24 October 2026. Check again monthly, and upgrade the plugin and
# DesignSystemPDF together (they meet through the print contract).

[java]
# Not downloaded. The toolkit, DesignSystemPDF, veraPDF and the HTML checker run on it.
minimum = 17
recommended = 21


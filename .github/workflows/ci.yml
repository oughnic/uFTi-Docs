# The quality gates (build and quality, sections 4 and 5): lint, a build per manual, the checks
# on each output, the stock-html5 smoke build (DEC-042), and the Windows PowerShell path.
# The checks that need a browser (axe-core and the theme probe) run in the "a11y" job, once per
# platform, and the PDF/UA check runs in each "check" job. Both are skipped for an output that is
# byte for byte the same as one that has already passed with the same tools and checks (DEC-206).
# The "tree" job assembles the publishing tree from the builds of the "build" job and checks it, so a pull request
# builds each manual once, and the second build that proves the output is the same runs on pushes only (DEC-207).
# Third-party actions are pinned to full commit SHAs. Permissions are read-only.
name: CI

on:
  push:
    branches: [dev, main, 'release/**', 'hotfix/**']
  pull_request:
  schedule:
    # Weekly, against the pinned versions: catches drift in what we fetch upstream.
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  JAVA_DISTRIBUTION: temurin
  JAVA_VERSION: '21'

jobs:
  lint:
    name: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the secret scanner reads the whole history
      - name: Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
      # Each job keeps its own cache key. A saved entry is never changed, so two jobs that need different tools must not share one:
      # the second would find the first's entry, miss its own tools and download them on every run (issue 149).
      - name: Pinned tools (cached by the lock file)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tools
          key: tools-lint-${{ runner.os }}-${{ hashFiles('build/tools.lock') }}
      - name: Bootstrap the toolkit, Vale and gitleaks
        run: build/scripts/bootstrap.sh --only dita-ot,vale,gitleaks
      - name: Source gates (theme, structure lint, prose and reading level, secrets)
        run: pwsh -NoProfile -File build/scripts/check-source.ps1
      - name: Rule tests (every source rule fails where it should, and the templates are valid DITA 1.3)
        run: pwsh -NoProfile -File build/scripts/test-source-rules.ps1
      - name: Applicability matrix
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: applicability-matrix
          path: out/applicability-matrix.csv
          if-no-files-found: ignore

  build:
    name: build (${{ matrix.deliverable }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        deliverable: [fixture-android-phone, fixture-android-tablet, fixture-windows, quick-start-windows, manual-windows, quick-start-android-phone, manual-android-phone, quick-start-android-tablet, manual-android-tablet, quick-start-iphone, manual-iphone, quick-start-ipad, manual-ipad, quick-start-macos, manual-macos]
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
      - name: Pinned tools (cached by the lock file)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tools
          key: tools-build-${{ runner.os }}-${{ hashFiles('build/tools.lock') }}
      - name: Bootstrap the toolkit, the plugin, DesignSystemPDF and Pagefind
        run: build/scripts/bootstrap.sh --build-only
      - name: Build the website and the PDF
        run: build/scripts/build.sh --project ${{ matrix.deliverable }}
      # The second build proves the toolchain, not a change to a page, so a pull request does not repeat it:
      # every push to a long-lived branch, the weekly run and an on-demand run still do (DEC-207).
      - name: Build again
        if: github.event_name != 'pull_request'
        run: build/scripts/build.sh --project ${{ matrix.deliverable }} --output out-again
      - name: The same input gives the same output
        if: github.event_name != 'pull_request'
        # Pagefind's index is left out: its bytes differ between runs on identical pages (DEC-053)
        run: diff -r -x pagefind out/${{ matrix.deliverable }} out-again/${{ matrix.deliverable }} && echo "byte for byte the same, the search index aside"
      - name: Keep the output
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-${{ matrix.deliverable }}
          path: |
            out/${{ matrix.deliverable }}
            out/logs
          if-no-files-found: error

  check:
    name: check (${{ matrix.deliverable }})
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        deliverable: [fixture-android-phone, fixture-android-tablet, fixture-windows, quick-start-windows, manual-windows, quick-start-android-phone, manual-android-phone, quick-start-android-tablet, manual-android-tablet, quick-start-iphone, manual-iphone, quick-start-ipad, manual-ipad]
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
      - name: Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Pinned tools (cached by the lock file)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tools
          key: tools-check-${{ runner.os }}-${{ hashFiles('build/tools.lock') }}
      - name: Bootstrap the checkers and the plugin whose tables the metadata checker reads
        run: build/scripts/bootstrap.sh --only dita-ot,govuk-plugin,designsystempdf,verapdf,vnu,plugin-tools
      - name: The built output
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site-${{ matrix.deliverable }}
          path: out
      - name: Hash of the built output
        id: hash
        run: echo "value=$(build/scripts/output-hash.sh ${{ matrix.deliverable }})" >> "$GITHUB_OUTPUT"
      - name: Has this output already passed the PDF/UA check?
        # not on the weekly run, which checks everything again against the pinned tools
        id: record
        if: github.event_name != 'schedule'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .pdfua-record
          key: pdfua-${{ matrix.deliverable }}-${{ steps.hash.outputs.value }}-${{ hashFiles('build/tools.lock', 'build/scripts/check-output.ps1', 'build/scripts/UftiBuild.psm1', '.github/workflows/ci.yml') }}
          lookup-only: true
      - name: Output gates (the two that need a browser run in the a11y job)
        run: pwsh -NoProfile -File build/scripts/check-output.ps1 -Deliverable ${{ matrix.deliverable }} -Without a11y,theme-browser${{ steps.record.outputs.cache-hit == 'true' && ',pdf-ua' || '' }}
      - name: Record the PDF/UA pass for this output
        if: github.event_name != 'schedule' && steps.record.outputs.cache-hit != 'true'
        run: mkdir -p .pdfua-record && echo "${{ matrix.deliverable }} ${{ steps.hash.outputs.value }}" > .pdfua-record/passed
      - name: Keep the record
        if: github.event_name != 'schedule' && steps.record.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .pdfua-record
          key: pdfua-${{ matrix.deliverable }}-${{ steps.hash.outputs.value }}-${{ hashFiles('build/tools.lock', 'build/scripts/check-output.ps1', 'build/scripts/UftiBuild.psm1', '.github/workflows/ci.yml') }}
      - name: Reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports-${{ matrix.deliverable }}
          path: out/reports
          if-no-files-found: ignore

  a11y:
    # axe-core at WCAG 2.2 AA over every built page, and the theme probe, in a browser (DEC-206). One job per
    # platform, so the browser and its system libraries are installed five times and not thirteen (issue 108).
    # A platform whose output is byte for byte the same as one that has already passed with these tools and
    # these checks needs no install and no run.
    name: accessibility in a browser (${{ matrix.group }})
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: windows
            deliverables: fixture-windows quick-start-windows manual-windows
          - group: android-phone
            deliverables: fixture-android-phone quick-start-android-phone manual-android-phone
          - group: android-tablet
            deliverables: fixture-android-tablet quick-start-android-tablet manual-android-tablet
          - group: iphone
            deliverables: quick-start-iphone manual-iphone
          - group: ipad
            deliverables: quick-start-ipad manual-ipad
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: The built output of the platform
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: site-*-${{ matrix.group }}
          merge-multiple: true
          path: out
      - name: Hash of the built output
        id: hash
        run: echo "value=$(build/scripts/output-hash.sh ${{ matrix.deliverables }})" >> "$GITHUB_OUTPUT"
      - name: Has this output already passed in a browser?
        # not on the weekly run, which checks everything again against the pinned tools
        id: record
        if: github.event_name != 'schedule'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .a11y-record
          key: browser-${{ matrix.group }}-${{ steps.hash.outputs.value }}-${{ hashFiles('build/tools.lock', 'build/scripts/a11y.mjs', 'build/scripts/a11y-exceptions.json', 'build/scripts/theme-probe.mjs', 'build/scripts/check-output.ps1', 'build/scripts/UftiBuild.psm1', '.github/workflows/ci.yml') }}
          lookup-only: true
      - name: Nothing to check
        if: steps.record.outputs.cache-hit == 'true'
        run: echo "The output of ${{ matrix.group }} is byte for byte the same as output that has already passed, with the same tools and checks. Nothing to run."
      - name: Node
        if: steps.record.outputs.cache-hit != 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Pinned tools (cached by the lock file)
        if: steps.record.outputs.cache-hit != 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tools
          key: tools-a11y-${{ runner.os }}-${{ hashFiles('build/tools.lock') }}
      - name: Playwright's browser (cached by the lock file)
        if: steps.record.outputs.cache-hit != 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('build/tools.lock') }}
      - name: Bootstrap the plugin whose accessibility runner this uses
        if: steps.record.outputs.cache-hit != 'true'
        run: build/scripts/bootstrap.sh --only plugin-tools
      - name: Install the accessibility runner
        if: steps.record.outputs.cache-hit != 'true'
        working-directory: .tools/plugin-tools/tools/a11y
        timeout-minutes: 15
        run: |
          # apt gives up on a stalled connection to the package server and tries again, instead of waiting
          # for the job's time limit (issue 108). Playwright's --with-deps installs its packages with apt.
          printf 'Acquire::Retries "5";\nAcquire::http::Timeout "30";\nAcquire::https::Timeout "30";\n' | sudo tee /etc/apt/apt.conf.d/99ufti-retries > /dev/null
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
          touch .chromium-installed
      - name: Browser gates (axe-core, and the theme probe)
        if: steps.record.outputs.cache-hit != 'true'
        run: |
          # every deliverable is checked, and the job fails if any one fails
          rc=0
          for d in ${{ matrix.deliverables }}; do
            pwsh -NoProfile -File build/scripts/check-output.ps1 -Deliverable "$d" -Only a11y,theme-browser || rc=1
          done
          exit $rc
      - name: Reports
        if: always() && steps.record.outputs.cache-hit != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports-a11y-${{ matrix.group }}
          path: out/reports
          if-no-files-found: ignore
      - name: Record the pass for this output
        if: github.event_name != 'schedule' && steps.record.outputs.cache-hit != 'true'
        run: mkdir -p .a11y-record && echo "${{ matrix.group }} ${{ steps.hash.outputs.value }}" > .a11y-record/passed
      - name: Keep the record
        if: github.event_name != 'schedule' && steps.record.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .a11y-record
          key: browser-${{ matrix.group }}-${{ steps.hash.outputs.value }}-${{ hashFiles('build/tools.lock', 'build/scripts/a11y.mjs', 'build/scripts/a11y-exceptions.json', 'build/scripts/theme-probe.mjs', 'build/scripts/check-output.ps1', 'build/scripts/UftiBuild.psm1', '.github/workflows/ci.yml') }}

  tree:
    # The publishing tree, assembled from the outputs that the build job has just made (build-site.sh --reuse), so
    # that a pull request does not build every manual a second time (DEC-207). It checks every link in the tree, the
    # root and platform pages, and that every page and anchor a help map names is there. The pages of a release are
    # checked by the gates of their own deliverable, on the same files, so axe-core and the Nu HTML Checker run over
    # the pages that are not (the root, the platforms, the two site pages and the not-found page), and not at all when
    # those pages have not changed.
    name: the tree (links, root pages, help maps)
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
      - name: Pinned tools (cached by the lock file)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tools
          key: tools-build-${{ runner.os }}-${{ hashFiles('build/tools.lock') }}
      - name: Bootstrap the toolkit, the plugin, DesignSystemPDF and Pagefind
        run: build/scripts/bootstrap.sh --build-only
      - name: The built manuals
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: site-manual-*
          merge-multiple: true
          path: out
      - name: The built Quick Starts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: site-quick-start-*
          merge-multiple: true
          path: out
      - name: Earlier releases, read back from the publish branch
        run: build/scripts/kept-from-branch.sh publish kept
      - name: Assemble the tree from those builds, and check its links
        run: build/scripts/build-site.sh --reuse --keep kept
      - name: Check the tree again, with the PowerShell checker (the bash build is not checked by it otherwise)
        run: pwsh -NoProfile -File build/scripts/check-site.ps1
      - name: Write the help maps, and check that every page and anchor they name is in the tree
        run: pwsh -NoProfile -File build/scripts/new-help-map.ps1 -Site out/site
      - name: Assemble the proposed help maps, and check their checksums
        run: |
          pwsh -NoProfile -File build/scripts/publish-help-maps.ps1 -Output out/help-maps-assembled -Status proposed
          (cd out/help-maps-assembled && sha256sum -c help-maps-SHA256SUMS)
      - name: The release pages are the pages that were checked
        run: |
          # The tree copies each deliverable's output into its release folder. Say so, with a comparison, before
          # relying on it: the gates of the deliverable then stand for the copy.
          . build/scripts/publications.sh
          for slug in windows android-phone android-tablet iphone ipad; do
            rel=$(ini_get "$slug" release)
            diff -rq "out/$(ini_get "$slug" manual)" "out/site/$slug/$rel" -x start -x version.json
            diff -rq "out/$(ini_get "$slug" quick-start)" "out/site/$slug/$rel/start"
          done
          echo "the release folders of five platforms are byte for byte the deliverables that were checked"
      - name: The pages of the tree that no deliverable checks
        id: pages
        run: |
          # The release folders of the platforms that the a11y job covers hold that job's pages, byte for byte.
          # macOS has no job of its own yet (DEC-207), so its pages stay in this check, with the root pages.
          for slug in windows android-phone android-tablet iphone ipad; do find "out/site/$slug" -name version.json -printf '%h/\n'; done | sort > out/release-folders.txt
          # not-found.html in the tree has absolute links (it is served at the address that was asked for), so opened
          # from a file it has no stylesheet; the same page before that rewrite, in out/site-root, is the one to check
          { find out/site -name '*.html' ! -name not-found.html | sort | grep -vFf out/release-folders.txt || true; echo out/site-root/not-found.html; } > out/tree-pages.txt
          echo "$(wc -l < out/tree-pages.txt) page(s) outside the releases"
          echo "value=$(xargs -d '\n' sha256sum < out/tree-pages.txt | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Has this set of pages already passed?
        # not on the weekly run, which checks everything again against the pinned tools
        id: record
        if: github.event_name != 'schedule'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tree-record
          key: tree-${{ steps.pages.outputs.value }}-${{ hashFiles('build/tools.lock', 'build/scripts/a11y.mjs', 'build/scripts/a11y-exceptions.json', '.github/workflows/ci.yml') }}
          lookup-only: true
      - name: Node
        if: steps.record.outputs.cache-hit != 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Playwright's browser (cached by the lock file)
        if: steps.record.outputs.cache-hit != 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('build/tools.lock') }}
      - name: Bootstrap the page checkers
        if: steps.record.outputs.cache-hit != 'true'
        run: build/scripts/bootstrap.sh --only vnu,plugin-tools
      - name: Install the accessibility runner
        if: steps.record.outputs.cache-hit != 'true'
        working-directory: .tools/plugin-tools/tools/a11y
        timeout-minutes: 15
        run: |
          # apt gives up on a stalled connection to the package server and tries again, instead of waiting
          # for the job's time limit (issue 108). Playwright's --with-deps installs its packages with apt.
          printf 'Acquire::Retries "5";\nAcquire::http::Timeout "30";\nAcquire::https::Timeout "30";\n' | sudo tee /etc/apt/apt.conf.d/99ufti-retries > /dev/null
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Those pages (axe-core, WCAG 2.2 AA, no exceptions, and the Nu HTML Checker)
        if: steps.record.outputs.cache-hit != 'true'
        run: |
          cp build/scripts/a11y.mjs build/scripts/a11y-exceptions.json .tools/plugin-tools/tools/a11y/
          mapfile -t pages < <(sed "s#^out/#$GITHUB_WORKSPACE/out/#" out/tree-pages.txt)
          (cd .tools/plugin-tools/tools/a11y && node a11y.mjs "${pages[@]}")
          java -jar .tools/vnu/vnu.jar --errors-only --skip-non-html "${pages[@]}"
      - name: Record the pass for these pages
        if: github.event_name != 'schedule' && steps.record.outputs.cache-hit != 'true'
        run: mkdir -p .tree-record && echo "${{ steps.pages.outputs.value }}" > .tree-record/passed
      - name: Keep the record
        if: github.event_name != 'schedule' && steps.record.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tree-record
          key: tree-${{ steps.pages.outputs.value }}-${{ hashFiles('build/tools.lock', 'build/scripts/a11y.mjs', 'build/scripts/a11y-exceptions.json', '.github/workflows/ci.yml') }}
      - name: Keep the logs and the link report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tree-logs
          path: |
            out/logs
            out/reports/site
          if-no-files-found: ignore

  smoke:
    name: smoke (stock html5, DEC-042)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
      - name: Pinned tools (cached by the lock file)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tools
          key: tools-smoke-${{ runner.os }}-${{ hashFiles('build/tools.lock') }}
      - name: Bootstrap the toolkit alone
        run: build/scripts/bootstrap.sh --only dita-ot
      - name: Build with the toolkit's stock html5 transformation
        run: build/scripts/build.sh --project fixture-smoke --smoke
      - name: Keep the log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smoke-log
          path: out/logs
          if-no-files-found: ignore

  windows:
    name: build on Windows (PowerShell)
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      # a short path inside the workspace, so the cache step below finds it (the scripts default to
      # %LOCALAPPDATA%\ufti-tools on Windows, because a deep checkout overruns dita.bat's command line)
      UFTI_TOOLS: ${{ github.workspace }}\.tools
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
      - name: Pinned tools (cached by the lock file)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tools
          key: tools-build-${{ runner.os }}-${{ hashFiles('build/tools.lock') }}
      - name: Bootstrap with PowerShell
        shell: pwsh
        run: build/scripts/bootstrap.ps1 -BuildOnly
      - name: Build with dita.bat
        shell: pwsh
        run: build/scripts/build.ps1 -Project fixture-android-phone

  ci:
    # One check for branch protection to require.
    name: ci
    if: always()
    needs: [lint, build, check, a11y, tree, smoke, windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every job passed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "a job failed or was cancelled: ${{ toJSON(needs) }}"
          exit 1
      - name: Green
        run: echo "every job passed"

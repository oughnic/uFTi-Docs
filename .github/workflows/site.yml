# Builds the publishable tree for an Azure Static Web App (build and quality, section 7; DEC-140 to
# DEC-143): a root, one folder per platform, and below each platform one folder per uFTi app release,
# each holding the manual and the Quick Start as a website and a PDF. It builds with the toolkit and
# the plugin only, checks every link in the tree, and keeps the tree and the archives of each current
# release as artifacts. On a push to main or release/**, or on demand (workflow_dispatch with "publish"
# ticked), the "publish" job then pushes the finished tree to the publish branch, so the output of this
# repository is a pushed asset that an Azure Static Web App can deploy from (DEC-144). The releases
# already published are read back from that branch before the build, so an old release stays online
# (DEC-143). It creates no Azure resource and holds no secret.
#
# Next step for the maintainer: deploy the publish branch. A commented-out step at the end shows how.
# Third-party actions are pinned to full commit SHAs. Permissions are read-only, except in the publish job.
name: Site

on:
  push:
    branches: [dev, main, 'release/**']
  pull_request:
    paths: ['build/**', 'content/**', '.github/workflows/site.yml']
  workflow_dispatch:
    inputs:
      publish:
        description: "Push the tree to the publish branch after the build"
        type: boolean
        default: false
      branch:
        description: "The branch that holds the published tree"
        type: string
        default: publish

permissions:
  contents: read

concurrency:
  group: site-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PUBLISH_BRANCH: ${{ inputs.branch || 'publish' }}

jobs:
  site:
    name: build the tree
    runs-on: ubuntu-24.04
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Pinned tools (cached by the lock file)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tools
          key: tools-build-${{ runner.os }}-${{ hashFiles('build/tools.lock') }}
      - name: Bootstrap the toolkit, the plugin, DesignSystemPDF and Pagefind
        run: build/scripts/bootstrap.sh --build-only
      - name: Earlier releases, read back from the publish branch
        run: build/scripts/kept-from-branch.sh "$PUBLISH_BRANCH" kept
      - name: Build the tree and check its links
        run: build/scripts/build-site.sh --keep kept --archive
      - name: Keep the tree
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: out/site
          if-no-files-found: error
      - name: Keep the archives of the current releases
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-archives
          path: out/archive
          if-no-files-found: error
      - name: Keep the logs and the link report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-logs
          path: |
            out/logs
            out/reports/site
          if-no-files-found: ignore

  # Pushes the finished tree to the publish branch (DEC-144). Only from main, release/** or an on-demand
  # run with "publish" ticked. One run at a time, never cancelled half way, so two publications cannot
  # overwrite each other. The tree already holds the earlier releases (read back before the build), and
  # the branch is replaced by exactly that tree.
  publish:
    name: publish the tree to a branch
    needs: site
    if: (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/'))) || (github.event_name == 'workflow_dispatch' && inputs.publish)
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: publish
      cancel-in-progress: false
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: The built tree
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: out/site
      - name: Push the tree to the publish branch
        run: build/scripts/publish-tree.sh out/site "$PUBLISH_BRANCH" "$GITHUB_REF_NAME"

  # Not yet enabled. To deploy: create the Static Web App in Azure, add its deployment token to this
  # repository's secrets as AZURE_STATIC_WEB_APPS_API_TOKEN, give this job `contents: read` and
  # `pull-requests: write` as the action's documentation says, pin the action to a full commit SHA,
  # and run it after the publish job on pushes to main only (DEC-016). The tree is already built and is
  # on the publish branch, so no build runs in Azure. (Azure can also deploy from the publish branch
  # directly, with the app location at the root of the branch and no build.)
  #
  # deploy:
  #   name: deploy to Azure Static Web Apps
  #   needs: site
  #   if: github.ref == 'refs/heads/main'
  #   runs-on: ubuntu-24.04
  #   steps:
  #     - uses: actions/download-artifact@<full commit SHA>
  #       with:
  #         name: site
  #         path: site
  #     - uses: Azure/static-web-apps-deploy@<full commit SHA>
  #       with:
  #         azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
  #         action: upload
  #         app_location: site
  #         skip_app_build: true
  #         skip_api_build: true

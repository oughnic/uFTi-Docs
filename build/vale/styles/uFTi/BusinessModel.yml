# DEC-040: topics never state price, "free", "forever", accounts, sign-in or where data lives.
# The words for an account are in Accounts.yml (DEC-249), so a page can switch off only them.
extends: existence
message: "'%s' is a business-model word. Topics never state price, 'free', accounts, sign-in or where data lives (DEC-040)."
level: error
ignorecase: true
tokens:
  - free
  - forever
  - price
  - prices
  - pricing
  - subscription
  - subscribe
  - sign in
  - sign-in
  - signin
  - log in
  - log-in
  - login
  - cloud
  - server

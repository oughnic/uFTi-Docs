# DEC-029: Flesch-Kincaid grade of 6 or less, per topic. Restated for the same reason as
# ReadingEase.yml (DEC-071).
extends: metric
message: "The Flesch-Kincaid grade is %s. Aim for 6 or less (DEC-029)."
level: error
link: https://en.wikipedia.org/wiki/Flesch%E2%80%93Kincaid_readability_tests
formula: |
  (0.39 * (words / sentences)) + (11.8 * (syllables / words)) - 15.59
condition: "> 6.0"

<?xml version="1.0" encoding="UTF-8"?>
<!-- A clickable diagram (DEC-036). Real text, theme colours as literals from the tokens block in
     build/theme/ufti.css, a title and a description. Links are written relative to the page that
     shows the diagram, as .html addresses, because the plugin inlines the file into that page and
     leaves cross-document links as written. The SVG link check resolves them the same way.
     No aria-labelledby or aria-describedby: the plugin prefixes every id when it inlines the file
     and leaves those attributes as written, so they would point at nothing. The title names the
     diagram, and the plugin adds an aria-label from the figure title. -->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 640 160" width="640" height="160" role="img">
  <title>The first steps</title>
  <desc>Two boxes joined by an arrow. The first says Make a workspace. The second says Add a person. Each box links to its page.</desc>
  <style>
    .box { fill: #D5E2F2; stroke: #1E3A5F; stroke-width: 2; }
    .label { font-family: "Atkinson Hyperlegible Next", Arial, sans-serif; font-size: 20px; fill: #12263F; text-anchor: middle; }
    .arrow { stroke: #5B6572; stroke-width: 3; fill: none; }
    a:hover .box, a:focus .box { fill: #1E3A5F; }
    a:hover .label, a:focus .label { fill: #FFFFFF; }
  </style>
  <a href="workspaces.html">
    <rect class="box" x="20" y="40" width="240" height="80" rx="4"/>
    <text class="label" x="140" y="88">Make a workspace</text>
  </a>
  <path class="arrow" d="M 270 80 L 360 80 M 345 70 L 360 80 L 345 90"/>
  <a href="add-a-person.html">
    <rect class="box" x="380" y="40" width="240" height="80" rx="4"/>
    <text class="label" x="500" y="88">Add a person</text>
  </a>
</svg>

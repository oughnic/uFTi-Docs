# Vale: prose lint for the DITA topics (build and quality, section 4; DEC-029).
# Vale converts each .dita file with the toolkit's html5 transformation, so the toolkit's bin
# folder must be on the PATH: build/scripts/check-source.ps1 does that. WP3 grows the uFTi style
# into the full style guide; the rules here are the ones the plan already fixes.
StylesPath = build/vale/styles
MinAlertLevel = suggestion
Vocab = uFTi

[*.dita]
BasedOnStyles = Readability, uFTi
# The reading-level targets per topic (DEC-029): Flesch reading ease 70 or more, Flesch-Kincaid
# grade 6 or lower. The other scores in the package are off.
Readability.FleschReadingEase = error
Readability.FleschReadingEase[condition] = "< 70.0"
Readability.FleschKincaid = error
Readability.FleschKincaid[condition] = "> 6.0"
Readability.AutomatedReadability = NO
Readability.ColemanLiau = NO
Readability.GunningFog = NO
Readability.LIX = NO
Readability.SMOG = NO
Readability.Polysyllables = NO

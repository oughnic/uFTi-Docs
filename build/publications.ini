# What is published, and as which uFTi release (build and quality, section 7; DEC-140 to DEC-143).
#
# This is the one place a release is declared. The scripts read it and set the site address, the
# folder in the published tree, the PDF names and the footer links from it. It is read by
# build/scripts/build.ps1 and build.sh (one deliverable), build-site.ps1 and build-site.sh (the
# whole tree) and check-site.ps1. It is never read from this repository's tags, the plugin or the
# toolkit: a release is a release of the uFTi app.
#
# [site]
#   base-url      Where the tree is served, with a closing slash. Every address in the output starts
#                 with it. Change it here if the host is not docs.ufti.com (DEC-146, Q24).
#
# [<platform>]    The section name is the platform's folder in the tree: lower case letters, digits
#                 and single hyphens. A platform appears on the site only when it has a section here.
#   title         The platform's name on the site.
#   device        The same, as it reads after "for": "for a Windows computer".
#   release       The uFTi app release this platform's manual and Quick Start were checked against.
#                 The form is Alpha-N, Beta-N or RC-N (a whole number, from 1), or a number such as
#                 1.0 or 1.2.3. The build fails if it is missing or any other form. Change it when the
#                 pictures and text are checked against a new release (and read the retention rule
#                 in build and quality, section 7, so the old release stays online).
#   app-version   The version the app itself prints (About uFTi), for the same build. Optional. It
#                 must be given, and must match, wherever the platform's pictures record a version
#                 (content/platforms/<platform>/keys/images.ditamap and images/manifest.json).
#   manual        The project file in build/projects/ that builds the manual.
#   quick-start   The project file in build/projects/ that builds the Quick Start.
#
# The order of the sections is the order on the site. The Android tablet has no manual yet, so it has
# no section.

[site]
base-url = https://docs.ufti.com/

[windows]
title = Windows
device = a Windows computer
release = Alpha-1
app-version = 0.1.0.1 (1)
manual = manual-windows
quick-start = quick-start-windows

[android-phone]
title = Android phone
device = an Android phone
release = Alpha-1
app-version = 0.1.0 (1)
manual = manual-android-phone
quick-start = quick-start-android-phone

[iphone]
title = iPhone
device = an iPhone
release = Alpha-1
manual = manual-iphone
quick-start = quick-start-iphone

[ipad]
title = iPad
device = an iPad
release = Alpha-1
manual = manual-ipad
quick-start = quick-start-ipad

[macos]
title = Mac
device = a Mac
release = Alpha-1
manual = manual-macos
quick-start = quick-start-macos

# Vale: prose lint for the DITA topics (build and quality, section 4; DEC-029, DEC-048).
# Vale converts each .dita file with the toolkit's html5 transformation, so the toolkit's bin
# folder must be on the PATH: build/scripts/check-source.ps1 does that. The rules are described in
# authoring/style-guide.md, and each has a test in build/scripts/test-source-rules.ps1.
StylesPath = build/vale/styles
MinAlertLevel = suggestion
Vocab = uFTi

[*.dita]
# The project's own rules, which include the reading-level targets of DEC-029: Flesch reading ease
# 70 or more (uFTi.ReadingEase) and Flesch-Kincaid grade 6 or lower (uFTi.GradeLevel), an average
# sentence of 15 words or fewer and none over 25.
BasedOnStyles = uFTi

# The vendored Readability package is not used. Its two Flesch rules carry the formulas we use, but
# their messages say "above 70" and "below 8" whatever threshold a project sets, so they are restated
# in the project's style with the right words (DEC-071). The package stays vendored, with its
# licence, for the formulas and for anyone who wants its other measures.

# An exception for one topic (DEC-029: a UI label, a proper name or a term with a glossary entry
# that pushes a topic over the line) is a section for that one file, with the rule it switches off
# and, above it, a comment with the reason and the day. There are none yet. For example:
#
#   # 18 October 2026: the entry names three Brontë family members, which are proper names.
#   [content/topics/example.dita]
#   uFTi.AverageSentence = NO

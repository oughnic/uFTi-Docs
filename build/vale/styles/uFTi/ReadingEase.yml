# DEC-029: Flesch reading ease of 70 or more, per topic. The formula is the one in the vendored
# Readability package (Flesch, 1948), restated here because that package's message says "70" and
# "8" whatever threshold a project sets (DEC-071).
extends: metric
message: "The Flesch reading ease is %s. Aim for 70 or more (DEC-029)."
level: error
link: https://en.wikipedia.org/wiki/Flesch%E2%80%93Kincaid_readability_tests
formula: |
  206.835 - (1.015 * (words / sentences)) - (84.6 * (syllables / words))
condition: "< 70.0"
